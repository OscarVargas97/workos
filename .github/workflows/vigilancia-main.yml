# ia-qa: sin rama protegida (repos privados sin Pro), detecta lo que llega a main sin PR o con checks en rojo
# y abre un issue «main en rojo».
name: vigilancia-main
on:
  push:
    branches: [main]
permissions:
  issues: write
  pull-requests: read
  checks: read
jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - name: ¿Vino de un PR en verde?
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          # GitHub tarda unos segundos en asociar el commit fusionado con su PR.
          for i in 1 2 3 4 5 6; do
            pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')
            [ -n "$pr" ] && break
            sleep 10
          done
          if [ -z "$pr" ]; then
            problem="Push directo a main sin PR ($SHA, por $ACTOR)."
          else
            # REST y no `gh pr view --json statusCheckRollup`: GraphQL no deja leerlo con el GITHUB_TOKEN.
            # Cuenta la última corrida de cada check (las anteriores pueden estar canceladas).
            head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
            bad=$(gh api "repos/$REPO/commits/$head/check-runs?per_page=100" --jq '.check_runs
              | group_by(.name) | map(max_by(.started_at))
              | map(select(.conclusion as $c | ($c != "success" and $c != "skipped" and $c != "neutral")) | .name)
              | join(", ")')
            [ -n "$bad" ] && problem="PR #$pr fusionado con checks en rojo o sin terminar: $bad."
          fi
          [ -z "$problem" ] && { echo "OK"; exit 0; }
          gh label create main-en-rojo --color b60205 -R "$REPO" --force >/dev/null
          gh issue create -R "$REPO" -l main-en-rojo -t "main en rojo: ${SHA:0:7}" --body "$problem

          Revisar el commit y decidir: arreglar con un PR nuevo o revertir (\`git revert $SHA\` en una rama y PR)."
          exit 1
