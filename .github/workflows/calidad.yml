# ia-qa: checks de cada PR. Copiado por la skill `calidad`; lo particular del repo va en .calidad/checks.sh.
name: calidad
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: calidad-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  flujo:
    if: github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Título en Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s' "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+' \
            || { echo "::error::El título «$TITLE» no sigue Conventional Commits."; exit 1; }
      - name: Cierra un issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) +([a-z0-9_.-]+/[a-z0-9_.-]+)?#[0-9]+' \
            || { echo "::error::El cuerpo del PR no tiene «Closes #n»."; exit 1; }
      - name: Actualiza CHANGELOG.md
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE"...HEAD | grep -qx CHANGELOG.md \
            || { echo "::error::El PR no actualiza CHANGELOG.md (Nuevo, Cambios, Arreglos)."; exit 1; }
  modo:
    runs-on: ubuntu-latest
    outputs:
      minimo: ${{ steps.m.outputs.minimo }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: m
        run: |
          grep -Eq '^modo: *"?m[ií]nimo' .calidad.yml && echo minimo=true >> "$GITHUB_OUTPUT" || echo minimo=false >> "$GITHUB_OUTPUT"
  checks:
    runs-on: ubuntu-latest
    needs: modo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: needs.modo.outputs.minimo != 'true'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: hashFiles('package.json') != ''
        with:
          node-version-file: package.json   # toma engines.node
      - uses: cachix/install-nix-action@c134e4c9e34bac6cab09cf239815f9339aaaf84e # v31.5.1
        if: hashFiles('flake.nix') != ''
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        if: hashFiles('global.json') != ''
        with:
          global-json-file: global.json   # solo si el repo lo fija
      - name: Checks del repo
        env:
          CALIDAD_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -f .calidad/checks.sh ]; then sh .calidad/checks.sh ci; else echo "Sin .calidad/checks.sh"; fi
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 detect --source /repo --redact --no-banner \
            --log-opts="$BASE..HEAD"
  semgrep:
    runs-on: ubuntu-latest
    needs: modo
    if: needs.modo.outputs.minimo != 'true'
    container: semgrep/semgrep:1.95.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Semgrep (solo lo nuevo del PR)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SEMGREP_SEND_METRICS: "off"
        run: |
          git config --global --add safe.directory "$PWD"
          semgrep scan --config p/default --error --baseline-commit "$BASE" --exclude legacy
