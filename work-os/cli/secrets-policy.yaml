# Allowlist de secretos por skill/agente (ver DECISIONS.md #2).
# Default-deny: un skill/agente solo puede pedir, vía `work secret get
# <nombre> --skill <skill>` (wrapper sobre rbw/Bitwarden, Fase 6), los
# nombres listados acá explícitamente para él. Si no está en su lista,
# se le niega, sin excepción - ni "skill" ni "nombre" con typos caen a
# un default-allow por accidente (el parser de work-os/cli/work exige
# coincidencia exacta de ambos).
#
# Plantilla por defecto de la opción workos.secretsPolicy - la real va en
# el repo privado. Gestionado por Nix (modules/workos.nix la publica en
# ~/.config/work-os/secrets-policy.yaml como symlink al store,
# de solo lectura) - cambiarla es un commit a este archivo + rebuild,
# nunca una edición local.
#
# Vacío/comentado a propósito: `work docs` (Fase 9, cli/docs/work_docs.py)
# ya es un consumidor real, pero activarlo es decisión de la persona (implica
# que work-docs pueda pegarle de verdad a Notion/Slack con sus tokens) -
# descomentar cuando estén cargados en Bitwarden. Formato:
#
# El nombre del secreto va acotado por empresa (notion-token-<empresa>,
# no "notion-token" a secas) - el uso personal es multi-empresa por naturaleza
# (DECISIONS.md #11), y esto evita que activar work-docs para una
# empresa dé acceso automático al token de otra. <empresa> es el mismo
# nombre que usás en ~/.config/work-os/companies.conf.
#
# work-docs:
#   - notion-token-acme
#   - slack-token-acme
